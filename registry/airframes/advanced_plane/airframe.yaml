id: advanced_plane
description: PX4 advanced fixed-wing demo aircraft. Rolls for take-off.
class: fixed_wing
launch: runway

model_uri: model://advanced_plane
base_link: base_link
imu_sensor: base_link::imu_sensor

geometry:
  footprint_radius_m: 1.3
  spawn_z_m: 0.2

performance:
  mass_kg: 2.5
  cruise_mps: 20.0
  max_mps: 35.0
  endurance_min: 40.0
  max_payload_kg: 0.5

bindings:
  px4:
    overlay: bindings/px4.sdf.j2
    vars:
      px4_model: advanced_plane
      sys_autostart: 4008
