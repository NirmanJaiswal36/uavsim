name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # These tests exercise the registry, allocator, SDF rendering, world
      # building, bridge generation and manifest. None of them need Gazebo or a
      # SITL binary, so they run on a bare runner in about a second.
      - name: Run tests
        run: python -m pytest tests/ -q
